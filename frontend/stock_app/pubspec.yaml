name: stock_app
description: "StockApp - Gestión de Inventario"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Networking
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.3
  
  # UI
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0
  
  # Camera & Barcode
  camera: ^0.11.0+2
  mobile_scanner: ^5.1.1
  
  # Image
  image_picker: ^1.0.7
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

  # Firebase Push Notifications - mobile
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

  # Offline Mode - SQLite
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/