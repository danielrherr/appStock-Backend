<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockApp Admin - Movimientos</title>
    <link rel="stylesheet" href="/web/css/styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">StockApp Admin</div>
            <ul class="sidebar-nav">
                <li><a href="/web/dashboard.html">Dashboard</a></li>
                <li><a href="/web/productos.html">Productos</a></li>
                <li><a href="/web/categorias.html">Categorías</a></li>
                <li><a href="/web/movimientos.html" class="active">Movimientos</a></li>
                <li><a href="#" id="logoutBtn" class="logout">Cerrar Sesión</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Movimientos</h1>
                <button class="btn-primary" onclick="openModal()" style="width: auto;">+ Nuevo Movimiento</button>
            </div>

            <div class="toolbar">
                <input type="date" class="search-input" id="fechaDesde" style="max-width: 160px;" placeholder="Desde">
                <input type="date" class="search-input" id="fechaHasta" style="max-width: 160px;" placeholder="Hasta">
                <select class="search-input" id="tipoFilter" style="max-width: 150px;">
                    <option value="">Todos los tipos</option>
                    <option value="entrada">Entrada</option>
                    <option value="salida">Salida</option>
                </select>
                <button class="btn-secondary" onclick="loadMovimientos()">Filtrar</button>
            </div>

            <div class="data-table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Producto</th>
                            <th>Tipo</th>
                            <th>Cantidad</th>
                            <th>Notas</th>
                        </tr>
                    </thead>
                    <tbody id="movimientosTable">
                        <tr><td colspan="5" class="loading">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Movimiento -->
    <div class="modal-overlay" id="movimientoModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Movimiento</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="movimientoForm">
                <div class="form-group">
                    <label for="producto_id">Producto *</label>
                    <select id="producto_id" required>
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tipo">Tipo *</label>
                    <select id="tipo" required>
                        <option value="">Seleccionar...</option>
                        <option value="entrada">Entrada</option>
                        <option value="salida">Salida</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cantidad">Cantidad *</label>
                    <input type="number" id="cantidad" required min="1" value="1">
                </div>
                <div class="form-group">
                    <label for="notas">Notas</label>
                    <textarea id="notas" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/web/js/app.js"></script>
    <script>
        // Check auth
        if (!requireAuth()) {}

        // Load on init
        document.addEventListener('DOMContentLoaded', async () => {
            await loadProductosForSelect();
            await loadMovimientos();

            // Check for new action
            const params = new URLSearchParams(window.location.search);
            if (params.get('action') === 'new') {
                openModal();
            }
        });

        async function loadProductosForSelect() {
            try {
                const productos = (await apiCall('/productos'))?.data ?? [];
                const select = document.getElementById('producto_id');

                productos.forEach(p => {
                    const stockVal = p.stock_actual ?? p.stock ?? 0;
                    select.innerHTML += `<option value="${p.id}">${p.nombre} (Stock: ${stockVal})</option>`;
                });
            } catch (err) {
                console.error('Error loading productos:', err);
            }
        }

        async function loadMovimientos() {
            try {
                const movimientos = (await apiCall('/movimientos'))?.data ?? [];
                const tbody = document.getElementById('movimientosTable');

                if (movimientos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay movimientos</td></tr>';
                    return;
                }

                // Filter by dates and type
                const fechaDesde = document.getElementById('fechaDesde').value;
                const fechaHasta = document.getElementById('fechaHasta').value;
                const tipoFilter = document.getElementById('tipoFilter').value;

                let filtered = movimientos;
                if (fechaDesde) {
                    filtered = filtered.filter(m => new Date(m.fecha) >= new Date(fechaDesde));
                }
                if (fechaHasta) {
                    filtered = filtered.filter(m => new Date(m.fecha) <= new Date(fechaHasta));
                }
                if (tipoFilter) {
                    filtered = filtered.filter(m => m.tipo === tipoFilter);
                }

                // Sort by date desc
                filtered.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

                tbody.innerHTML = filtered.map(m => `
                    <tr>
                        <td>${formatDate(m.fecha)}</td>
                        <td>${m.producto_nombre || 'N/A'}</td>
                        <td><span class="badge ${m.tipo === 'entrada' ? 'badge-success' : 'badge-warning'}">${m.tipo}</span></td>
                        <td>${m.cantidad}</td>
                        <td>${m.motivo || m.notas || '-'}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error loading movimientos:', err);
                showToast('Error al cargar movimientos', 'error');
            }
        }

        function openModal() {
            document.getElementById('movimientoModal').classList.add('active');
            document.getElementById('movimientoForm').reset();
        }

        function closeModal() {
            document.getElementById('movimientoModal').classList.remove('active');
        }

        document.getElementById('movimientoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                producto_id: document.getElementById('producto_id').value,
                tipo: document.getElementById('tipo').value,
                cantidad: parseInt(document.getElementById('cantidad').value),
                motivo: document.getElementById('notas').value
            };

            try {
                await apiCall('/movimientos', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                showToast('Movimiento registrado');
                closeModal();
                loadMovimientos();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
