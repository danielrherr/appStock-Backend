<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockApp Admin - Login</title>
    <link rel="stylesheet" href="/web/css/styles.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h1>StockApp Admin</h1>
            <p class="subtitle">Gestión de Inventario</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <p id="errorMsg" class="error-msg"></p>
            </form>
        </div>
    </div>
    <script src="/web/js/app.js"></script>
    <script>
        // Login page specific
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/web/dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Error de autenticación';
                }
            } catch (err) {
                errorMsg.textContent = 'Error de conexión';
            }
        });

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/web/dashboard.html';
        }
    </script>
</body>
</html>
